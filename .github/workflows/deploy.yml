name: Deploy Infrastructure

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write   # required for OIDC
  contents: read
  pull-requests: write  # allow posting cdk diff as PR comment

env:
  AWS_RETRY_MODE: adaptive
  AWS_MAX_ATTEMPTS: "10"

jobs:
  diff:
    name: CDK Diff (preview changes)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stoa-infra
        uses: actions/checkout@v4
        with:
          path: stoa-infra

      # CDK references ../stoa-backend/dist for Lambda code
      - name: Checkout stoa-backend
        uses: actions/checkout@v4
        with:
          repository: stoasystem/stoa-backend
          token: ${{ secrets.GITHUB_TOKEN }}
          path: stoa-backend

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js (for CDK CLI)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install CDK CLI
        run: npm install -g aws-cdk

      - name: Build Lambda dist (linux arm64)
        working-directory: stoa-backend
        run: |
          pip install uv
          rm -rf dist
          pip install \
            --platform manylinux2014_aarch64 \
            --implementation cp \
            --python-version 3.12 \
            --only-binary :all: \
            --target dist \
            -r requirements.txt
          cp -r src/stoa dist/stoa

      - name: Install CDK Python dependencies
        working-directory: stoa-infra
        run: |
          pip install uv
          uv sync

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::562923011260:role/stoa-github-infra-deploy
          aws-region: eu-central-2

      - name: CDK Diff
        id: diff
        working-directory: stoa-infra
        run: cdk diff --all 2>&1 | tee /tmp/cdk-diff.txt || true

      - name: Comment diff on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const diff = fs.readFileSync('/tmp/cdk-diff.txt', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## CDK Diff\n\`\`\`\n${diff.slice(0, 60000)}\n\`\`\``
            });

  deploy:
    name: CDK Deploy
    runs-on: ubuntu-latest
    needs: diff
    # Only deploy on push to main (not on PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout stoa-infra
        uses: actions/checkout@v4
        with:
          path: stoa-infra

      - name: Checkout stoa-backend
        uses: actions/checkout@v4
        with:
          repository: stoasystem/stoa-backend
          token: ${{ secrets.GITHUB_TOKEN }}
          path: stoa-backend

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js (for CDK CLI)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install CDK CLI
        run: npm install -g aws-cdk

      - name: Build Lambda dist (linux arm64)
        working-directory: stoa-backend
        run: |
          pip install uv
          rm -rf dist
          pip install \
            --platform manylinux2014_aarch64 \
            --implementation cp \
            --python-version 3.12 \
            --only-binary :all: \
            --target dist \
            -r requirements.txt
          cp -r src/stoa dist/stoa

      - name: Install CDK Python dependencies
        working-directory: stoa-infra
        run: |
          pip install uv
          uv sync

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::562923011260:role/stoa-github-infra-deploy
          aws-region: eu-central-2

      - name: CDK Deploy (all stacks)
        working-directory: stoa-infra
        run: |
          for attempt in 1 2 3; do
            echo "CDK deploy attempt ${attempt}/3"
            if cdk deploy --all --require-approval never; then
              exit 0
            fi
            if [ "$attempt" = "3" ]; then
              echo "CDK deploy failed after ${attempt} attempts"
              exit 1
            fi
            sleep $((attempt * 30))
          done
