name: Deploy Infrastructure to Production

# Direct production delivery for pushes to main. deploy.yml stays the
# credential-free formal verification DAG and must not mutate stacks.
# Sandbox stacks are synthesized by the app but are never named here.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: infra-production-deploy
  cancel-in-progress: false

env:
  AWS_RETRY_MODE: adaptive
  AWS_MAX_ATTEMPTS: "10"

jobs:
  deploy:
    name: Diff then deploy production stacks
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out infra
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: stoa-infra
          persist-credentials: false

      - name: Check out backend
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: stoasystem/stoa-backend
          path: stoa-backend
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: 3.12.13

      # This deploy rebuilds backend main and republishes it. Only rebuild a
      # commit the backend pipeline has already released, and never while one
      # of its runs is unfinished. A check, not a lock: see the script.
      - name: Check the backend release has settled
        id: backend_release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python stoa-infra/scripts/check_backend_release.py settled --backend-root stoa-backend

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.11.16
          enable-cache: false

      - name: Check the CDK app for undefined names
        working-directory: stoa-infra
        run: uvx ruff@0.15.14 check --isolated --select F821 app.py stacks

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install CDK CLI
        run: npm install -g aws-cdk@2.1136.0

      - name: Build Lambda dist (CDK hashes it as an asset)
        working-directory: stoa-backend
        run: python scripts/build_lambda_dist.py

      - name: Verify Lambda dist provenance
        working-directory: stoa-backend
        run: python scripts/build_lambda_dist.py --verify-only

      - name: Check the dist is the settled backend release
        env:
          CONFIRMED_SHA: ${{ steps.backend_release.outputs.sha }}
        run: |
          python stoa-infra/scripts/check_backend_release.py dist \
            --dist stoa-backend/dist \
            --expected-sha "$CONFIRMED_SHA"

      - name: Install CDK dependencies
        working-directory: stoa-infra
        run: uv sync --frozen

      - name: Verify dist the way synth will
        working-directory: stoa-infra
        run: |
          set -euo pipefail
          command -v uv
          uv --version
          .venv/bin/python -c 'from stacks.lambda_dist_guard import verify_lambda_dist; verify_lambda_dist()'

      # The only job a push to main runs, so the only place these tests can stop
      # a deploy. deploy.yml runs one of the two files and only when dispatched.
      # Before the credentials on purpose: the tests must not reach AWS.
      - name: Run infra tests
        working-directory: stoa-infra
        run: uv run --frozen pytest -q tests/

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: arn:aws:iam::562923011260:role/stoa-github-infra-deploy
          aws-region: eu-central-2

      - name: Check production serves the settled backend release
        env:
          CONFIRMED_SHA: ${{ steps.backend_release.outputs.sha }}
        run: |
          python stoa-backend/scripts/verify_live_release.py \
            --expected-sha "$CONFIRMED_SHA" \
            --phase pre-deploy \
            --output-dir "${RUNNER_TEMP}/release-record/pre-deploy"

      - name: Snapshot live Lambda environment maps
        working-directory: stoa-infra
        run: python scripts/snapshot_lambda_environment.py

      - name: CDK diff
        working-directory: stoa-infra
        run: |
          set -euo pipefail
          cdk diff 2>&1 | tee "${RUNNER_TEMP}/cdk-diff.txt"

      # The same checks again, bound to the commit confirmed above, as close to
      # the deploy as a separate step can be. This narrows the window in which
      # a backend release can start; it does not close it.
      - name: Recheck the backend release right before deploying
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CONFIRMED_SHA: ${{ steps.backend_release.outputs.sha }}
        run: |
          set -euo pipefail
          python stoa-infra/scripts/check_backend_release.py settled \
            --backend-root stoa-backend \
            --expected-sha "$CONFIRMED_SHA"
          python stoa-backend/scripts/verify_live_release.py \
            --expected-sha "$CONFIRMED_SHA" \
            --phase pre-deploy \
            --output-dir "${RUNNER_TEMP}/release-record/recheck"

      - name: Deploy production stacks
        working-directory: stoa-infra
        run: |
          set -euo pipefail
          cdk deploy \
            StoaAuthStack \
            StoaDatabaseStack \
            StoaStorageStack \
            StoaNotificationStack \
            StoaAiStack \
            StoaApiStack \
            StoaMonitoringStack \
            StoaFrontendStack \
            StoaReleaseDeliveryStack \
            --require-approval never

      # Reads back what the five production aliases serve after the deploy and
      # checks it is this run's build. It only reports; it moves nothing back.
      - name: Verify live production release
        env:
          CONFIRMED_SHA: ${{ steps.backend_release.outputs.sha }}
        run: |
          python stoa-backend/scripts/verify_live_release.py \
            --expected-sha "$CONFIRMED_SHA" \
            --phase post-deploy \
            --local-dist stoa-backend/dist \
            --output-dir "${RUNNER_TEMP}/release-record/post-deploy"

      # The app-planet preview (#1, #2) deploys on its own, after production is
      # deployed and read back: a failed first preview deploy (hosted zone,
      # record or certificate) then stops only the preview, never a
      # production stack or its release check.
      - name: Deploy preview stacks
        working-directory: stoa-infra
        run: |
          set -euo pipefail
          cdk deploy \
            StoaFrontendPreviewPlanetStack \
            StoaFrontendPreviewPublisherStack \
            --exclusively \
            --require-approval never

      - name: Publish change surface to run summary
        if: always()
        run: |
          set -euo pipefail
          diff_file="${RUNNER_TEMP}/cdk-diff.txt"
          if [ ! -s "$diff_file" ]; then
            echo "No diff output was produced." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## CDK diff"
            echo
            echo '```'
            head -c 800000 "$diff_file"
            echo
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Upload diff
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: cdk-diff
          path: ${{ runner.temp }}/cdk-diff.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Publish release records to run summary
        if: always()
        run: |
          set -euo pipefail
          records="${RUNNER_TEMP}/release-record"
          if [ ! -d "$records" ]; then
            echo "No release record was produced." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for phase in pre-deploy recheck post-deploy; do
            record="${records}/${phase}/release.json"
            [ -s "$record" ] || continue
            {
              echo "## Live release record: ${phase}"
              echo
              echo '```json'
              cat "$record"
              echo '```'
              echo
              echo '```'
              cat "${record}.sha256"
              echo '```'
            } >>"$GITHUB_STEP_SUMMARY"
          done

      - name: Upload release records
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: release-record-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-record/
          if-no-files-found: warn
          retention-days: 90
